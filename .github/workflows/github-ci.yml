name: Photosite

on:
  push:
    branches:
      - main
      - develop
      - after-5-hours
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: write
    steps:
      - name: Checkout photosite
        uses: actions/checkout@v4
        with:
          path: photosite

      - name: Checkout Stephans-KMP-Components
        uses: actions/checkout@v4
        with:
          repository: sknull/Stephans-KMP-Components
          path: Stephans-KMP-Components
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.Gradle_Encryption_Key }}

      - name: Run Tests
        working-directory: photosite
        env:
          GITHUB_ACTOR: sknull
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: | 
          chmod +x gradlew 
          ./gradlew test --no-configuration-cache

      - name: Build and deploy package
        working-directory: photosite
        env:
          GITHUB_ACTOR: sknull
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew 
          ./gradlew publish -x test
